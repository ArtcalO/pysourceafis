name: Release

# Push a tag like v0.1.0 after updating CHANGELOG.md and src/pysourceafis/_version.py.
# PyPI publishing uses trusted publishing: configure it once on pypi.org
# (project pysourceafis -> Publishing -> GitHub: this repository, workflow
# release.yml, environment pypi). No API token is stored in GitHub.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Version and release notes must match the tag
        run: python tools/release_notes.py --check "${GITHUB_REF_NAME}" > release-notes.md
      - run: pip install build
      - run: python -m build
      - name: Smoke test the wheel
        run: |
          pip install "$(ls dist/*.whl)[testing]"
          cd "$RUNNER_TEMP" && python -m pysourceafis doctor
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/
            release-notes.md

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: dist/*
