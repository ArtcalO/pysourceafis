name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Never attach real fingerprint images or templates** - they are
        personal biometric data. Reproduce with `pysourceafis.testing.synthetic_image()` instead.
        Security problems: use private vulnerability reporting (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal code to reproduce
      render: python
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `python -m pysourceafis doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Full error message / traceback
      render: text
