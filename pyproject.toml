[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pysourceafis"
dynamic = ["version"]
description = "Fingerprint matching for Python, powered by SourceAFIS (unofficial wrapper)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Carmel Niyungeko" }]
keywords = ["fingerprint", "biometrics", "sourceafis", "afis", "fingerprint-matching", "identification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Java",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "JPype1>=1.5.0",
    "Pillow>=9.1",
    # A Java runtime shipped as a wheel, so `pip install pysourceafis` needs no
    # separate Java install. jdk4py publishes wheels for these platforms only;
    # elsewhere pysourceafis uses JAVA_HOME / PYSOURCEAFIS_JAVA_HOME / java on PATH.
    "jdk4py>=21; (sys_platform == 'win32' and platform_machine == 'AMD64') or sys_platform == 'darwin' or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64'))",
]

[project.optional-dependencies]
testing = ["numpy>=1.23"]
dev = ["numpy>=1.23", "pytest>=7.4", "ruff>=0.6", "build>=1.0"]

[project.scripts]
pysourceafis = "pysourceafis.cli:main"

[project.urls]
Homepage = "https://github.com/ArtcalO/pysourceafis"
Source = "https://github.com/ArtcalO/pysourceafis"
Issues = "https://github.com/ArtcalO/pysourceafis/issues"
Changelog = "https://github.com/ArtcalO/pysourceafis/blob/main/CHANGELOG.md"
SourceAFIS = "https://sourceafis.machinezoo.com/"

[tool.hatch.version]
path = "src/pysourceafis/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pysourceafis"]
# The jars are generated (and git-ignored), so they must be listed explicitly.
artifacts = ["src/pysourceafis/_jars/*.jar"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "tools/hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src/pysourceafis", "java/src", "tools", "tests", "docs", "examples", "README.md", "CHANGELOG.md",
           "CONTRIBUTING.md", "LICENSE", "NOTICE"]
exclude = ["src/pysourceafis/_jars"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -p no:faulthandler"
markers = ["slow: slower tests (large galleries)"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
